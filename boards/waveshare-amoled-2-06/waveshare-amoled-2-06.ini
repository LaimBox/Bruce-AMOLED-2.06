[env:waveshare-amoled-2-06]
board = waveshare-amoled-2-06
board_build.partitions = default_16MB.csv
build_src_filter = ${env.build_src_filter} +<../boards/waveshare-amoled-2-06>
build_flags =
	${env.build_flags}
	-Iboards/waveshare-amoled-2-06
	-Isrc
	-DCORE_DEBUG_LEVEL=1
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDEVICE_NAME='"Waveshare AMOLED 2.06 Watch"'
	-DWAVESHARE_AMOLED_206=1
	-DUSE_ARDUINO_GFX=1

	; ---- Display: QSPI bus + CO5300 AMOLED driver ----
	-DTFT_DATABUS_N=1          ; Arduino_ESP32QSPI
	-DTFT_DISPLAY_DRIVER_N=41  ; Arduino_CO5300
	-DTFT_CS=12
	-DTFT_SCLK=11
	-DTFT_D0=4
	-DTFT_D1=5
	-DTFT_D2=6
	-DTFT_D3=7
	-DTFT_RST=8
	-DTFT_ROTATION=0
	-DTFT_IPS=0
	-DTFT_WIDTH=410
	-DTFT_HEIGHT=502
	-DTFT_COL_OFS1=22
	-DTFT_ROW_OFS1=0
	-DTFT_COL_OFS2=0
	-DTFT_ROW_OFS2=0
	-DSMOOTH_FONT=1
	-DFP=1
	-DFM=2
	-DFG=3
	-DMINBRIGHT=1

	; ---- I2C (touch, PMU, RTC, IMU all share this bus) ----
	-DSYS_I2C_SDA=15
	-DSYS_I2C_SCL=14
	-DGROVE_SDA=15
	-DGROVE_SCL=14

	; ---- Touch (FT3168, register-level via Wire, see interface.cpp) ----
	-DHAS_TOUCH=1
	-DTOUCH_INT=38
	-DTOUCH_RST=9

	; ---- SD card (SPI mode on the SDMMC pins: CLK=2, CMD=1, D0=3, CS=17) ----
	-DSDCARD_SCK=2
	-DSDCARD_MOSI=1
	-DSDCARD_MISO=3
	-DSDCARD_CS=17

	; ---- Buttons ----
	-DHAS_BTN=1
	-DBTN_ALIAS='"Boot"'
	-DBTN_PIN=0
	-DBTN_ACT=LOW

	; PWR button lives on AXP2101 EXIO6, not a normal GPIO - handled in interface.cpp

	; ---- No IR/RF/BadUSB pins confirmed yet for this board ----
	-DIR_TX_PINS='{{"Unavailable", -1}}'
	-DIR_RX_PINS='{{"Unavailable", -1}}'
	-DRF_TX_PINS='{{"Unavailable", -1}}'
	-DRF_RX_PINS='{{"Unavailable", -1}}'
	-DTXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @ 0.2.1
	moononournation/GFX Library for Arduino @ ^1.6.0
